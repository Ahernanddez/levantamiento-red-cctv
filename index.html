<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Catálogo de materiales compartido, listas por estudio e informe imprimible"
    />

    <script>
      /*
       * El tema se marca antes de pintar. Si lo decidiera React, la pantalla
       * aparecería un instante en el tema equivocado al abrir la app.
       * La clave y los valores deben coincidir con src/lib/tema.ts.
       */
      (function () {
        try {
          var t = localStorage.getItem("levantamiento-red-cctv:tema");
          document.documentElement.dataset.tema =
            t === "claro" || t === "oscuro" ? t : "sistema";
        } catch (e) {
          document.documentElement.dataset.tema = "sistema";
        }
      })();
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/iconos/manzana-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Materiales" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Lista de materiales</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
